# Selectro IZAR Gateway v0.2 DEV — ESPHome Native API, 10 slots
# Board ESP32-C3 + CC1101, 868.95 MHz wM-Bus T1 (R3 PRIOS).
# This is NOT a verified full implementation of izarv2 (XMQ).
esphome:
  name: selectro-izar-gateway
  friendly_name: Selectro IZAR Gateway
  project:
    name: selectro.izar_gateway
    version: 0.2.4-dev
esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: esp-idf
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password
# No preconfigured home SSID. NVS may retain old provisioning on a test board.
wifi:
  reboot_timeout: 0s
  ap:
    ssid: "Selectro IZAR Setup"
    password: !secret ap_password
    ap_timeout: 15s
captive_portal:
web_server:
  port: 80
  version: 3
  auth:
    username: !secret web_username
    password: !secret web_password
external_components:
  - source: github://SzczepanLeon/esphome-components@01464a25c704b7c4e7e272affbd82be23568cc74
    components: [wmbus_common, wmbus_radio]
  # DEV: pin this to a tested commit or tag before shipping.
  - source: github://Mikescotland/selectro-izar-esphome@main
    components: [selectro_izar]
spi:
  clk_pin: GPIO4
  miso_pin: GPIO5
  mosi_pin: GPIO6
wmbus_common:
  drivers: [izar]
selectro_izar:
  id: selectro_gateway
  admin_username: !secret web_username
  admin_password: !secret web_password
wmbus_radio:
  radio_type: CC1101
  cs_pin: GPIO7
  irq_pin: GPIO2
  frequency: 868.95MHz
  on_frame:
    - then:
        - lambda: |-
            // Mark even unknown-key frames from recognized Diehl models handled;
            // successful decoding is reported independently by Selectro.
            if (id(selectro_gateway).handle_packet(frame->data(), frame->rssi()))
              frame->mark_as_handled();
time:
  - platform: sntp
    id: selectro_clock

sensor:
  - platform: template
    name: "IZAR 01 Total"
    lambda: 'return id(selectro_gateway).slot_total(0);'
    update_interval: 15s
    unit_of_measurement: "m³"
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 3
  - platform: template
    name: "IZAR 01 Previous Month"
    lambda: 'return id(selectro_gateway).slot_target(0);'
    update_interval: 15s
    unit_of_measurement: "m³"
    accuracy_decimals: 3
  - platform: template
